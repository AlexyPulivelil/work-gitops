apiVersion: v2
name: platform-bundle
description: Umbrella chart that deploys nginx and redis together
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: nginx
    version: 23.0.3
    repository: oci://registry-1.docker.io/techino
    condition: nginx.enabled
  - name: redis
    version: 20.6.3
    repository: oci://registry-1.docker.io/techino
    condition: redis.enabled
