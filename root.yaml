apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  sources:
    # Helm chart from Docker Hub — templates only, no hardcoded values
    - repoURL: registry-1.docker.io/techino
      chart: app-of-apps
      targetRevision: 0.3.0
      helm:
        valueFiles:
          - $infra/envs/dev/infra/infra.yaml   # env config: repoURL, registry, namespace
          - $infra/envs/dev/infra/apps.yaml    # app versions: bump here for new builds
    # GitOps repo — provides both infra.yaml and apps.yaml
    - repoURL: https://github.com/AlexyPulivelil/work-gitops.git
      targetRevision: HEAD
      ref: infra
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
